# Builds the patched player: upstream sources pinned in default.xml + AVP/patches.
# check what is installed in ubuntu-latest https://github.com/actions/runner-images
name: Build APK
on:
  push:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  # a newer push waits for the running build instead of cancelling it (only the latest waits)
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # arm only: what phones and TV boxes run, halves the native build time
      NDK_CPU_X86: 0
      NDK_CPU_X86_64: 0
    steps:
    - uses: actions/checkout@v5
      with:
        path: nova/AVP
    - name: setup java17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: install packages
      run: |
        sudo apt-get update || sudo apt-get update
        sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config
    - name: setup ndk
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
    - name: fetch sources
      run: python3 nova/AVP/script/fetch-sources.py nova/AVP/default.xml nova --skip AVP
    - name: apply patches
      run: |
        cp nova/AVP/Makefile nova/Makefile
        nova/AVP/script/apply-patches.sh nova
    - name: unit tests (fork features)
      run: |
        cd nova/Video
        ./gradlew --no-daemon \
          :FileCoreLibrary:testDebugUnitTest --tests '*SourceAccessPolicyTest' \
          :MediaLib:testDebugUnitTest --tests '*FolderEpisodeNamingTest' --tests '*MetadataOverridesTest' --tests '*TrackLanguageHintsTest' --tests '*TmdbTextFallbackTest' --tests '*AniListClientTest' --tests '*MassDeletionGuardTest' --tests '*AnimePathTest' --tests '*FormatTimeTest' --tests '*AnimeTitleMatchTest'
    - name: build
      run: |
        cd nova/Video
        ./gradlew --no-daemon -Puniversal assembleNoamazonDebug
    - name: list the permissions of the final APK
      continue-on-error: true
      run: |
        apk=$(find nova/Video/build/outputs/apk -name '*.apk' | head -1)
        aapt2=$(ls -d $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
        perms=$("$aapt2" dump permissions "$apk" | grep -o "name='[^']*'" | sed "s/name='//;s/'//" | sort -u | tr '\n' ' ')
        echo "$perms"
        echo "::notice title=PERMISSIONS::$perms"
    - uses: actions/upload-artifact@v5
      with:
        name: apk
        path: nova/Video/build/outputs/apk/**/*.apk
    - uses: actions/upload-artifact@v5
      if: failure()
      with:
        name: test-reports
        path: |
          nova/FileCoreLibrary/build/reports/tests/
          nova/MediaLib/build/reports/tests/
          nova/Video/build/reports/lint-results-*.html

  # Launches the APK on an emulator and prints small screenshots into the log (between
  # SHOT-BEGIN/SHOT-END, base64 jpeg) so UI changes can be reviewed without a device.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/download-artifact@v5
      with:
        name: apk
        path: apk
    - name: enable kvm
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: write screenshot helper
      run: |
        command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
        cat > shot.sh <<'SH'
        #!/bin/bash
        # usage: shot.sh name
        # small jpeg, published later as job annotations (readable through the checks API)
        mkdir -p shots
        adb exec-out screencap -p > "$1.png"
        convert "$1.png" -resize 270x -quality 45 "shots/$1.jpg"
        SH
        chmod +x shot.sh
        # annotations are cut at 4096 characters and limited to 10 per step: split every
        # screenshot in 4000 character chunks, step N publishes chunks 10*(N-1) .. 10*N-1
        cat > publish.sh <<'SH'
        #!/bin/bash
        part=$1; i=0
        for f in shots/*.jpg; do
          [ -f "$f" ] || continue
          name=$(basename "$f" .jpg)
          b64=$(base64 -w 0 "$f"); n=$(( (${#b64} + 3999) / 4000 ))
          for k in $(seq 0 $((n - 1))); do
            if [ $((i / 10 + 1)) -eq "$part" ]; then
              echo "::notice title=SHOT $name $((k + 1))/$n::${b64:$((k * 4000)):4000}"
            fi
            i=$((i + 1))
          done
        done
        SH
        chmod +x publish.sh
    - name: make a test video
      run: |
        command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
        ffmpeg -loglevel error -f lavfi -i testsrc2=duration=120:size=1280x720:rate=24 \
          -f lavfi -i sine=frequency=440:duration=120 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest test-video.mp4
    - name: run on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: true
        script: |
          adb root || true
          adb install -r -g "$(find apk -name '*.apk' | head -1)"
          adb shell monkey -p io.github.oop23.renova -c android.intent.category.LAUNCHER 1
          sleep 25
          ./shot.sh 01-launch
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          ./shot.sh 02-after-back
          adb shell am start -n io.github.oop23.renova/com.archos.mediacenter.video.utils.VideoPreferencesActivity || true
          sleep 8
          ./shot.sh 03-settings
          adb push test-video.mp4 /sdcard/Movies/test-video.mp4
          adb shell am start -a android.intent.action.VIEW -t video/mp4 -d file:///sdcard/Movies/test-video.mp4 -n io.github.oop23.renova/com.archos.mediacenter.video.player.PlayerActivity || true
          sleep 12
          ./shot.sh 04-player
          adb shell input tap 640 360
          sleep 2
          ./shot.sh 05-player-controls
          adb shell input keyevent KEYCODE_BACK
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          ./shot.sh 06-after-player
          # each script line runs in its own shell: keep every command on one line
          adb logcat -d -b crash > crash.txt || true
          if [ -s crash.txt ]; then echo "::warning title=CRASH::$(grep -A15 -i 'renova\|FATAL' crash.txt | head -c 3500 | tr '\n' '|' | tr -d '%')"; fi
    - name: publish screenshots (1)
      if: always()
      run: ./publish.sh 1
    - name: publish screenshots (2)
      if: always()
      run: ./publish.sh 2
    - name: publish screenshots (3)
      if: always()
      run: ./publish.sh 3
    - name: publish screenshots (4)
      if: always()
      run: ./publish.sh 4
