# Builds the patched player: upstream sources pinned in default.xml + AVP/patches.
# check what is installed in ubuntu-latest https://github.com/actions/runner-images
name: Build APK
on:
  push:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # arm only: what phones and TV boxes run, halves the native build time
      NDK_CPU_X86: 0
      NDK_CPU_X86_64: 0
    steps:
    - uses: actions/checkout@v4
      with:
        path: nova/AVP
    - name: setup java17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: install packages
      run: |
        sudo apt-get update || sudo apt-get update
        sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config
    - name: setup ndk
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
    - name: fetch sources
      run: python3 nova/AVP/script/fetch-sources.py nova/AVP/default.xml nova --skip AVP
    - name: apply patches
      run: |
        cp nova/AVP/Makefile nova/Makefile
        nova/AVP/script/apply-patches.sh nova
    - name: unit tests (fork features)
      run: |
        cd nova/Video
        ./gradlew --no-daemon \
          :FileCoreLibrary:testDebugUnitTest --tests '*SourceAccessPolicyTest' \
          :MediaLib:testDebugUnitTest --tests '*FolderEpisodeNamingTest' --tests '*MetadataOverridesTest' --tests '*TrackLanguageHintsTest' --tests '*TmdbTextFallbackTest' --tests '*AniListClientTest'
    - name: build
      run: |
        cd nova/Video
        ./gradlew --no-daemon -Puniversal assembleNoamazonDebug
    - uses: actions/upload-artifact@v4
      with:
        name: apk
        path: nova/Video/build/outputs/apk/**/*.apk
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-reports
        path: |
          nova/FileCoreLibrary/build/reports/tests/
          nova/MediaLib/build/reports/tests/
          nova/Video/build/reports/lint-results-*.html
